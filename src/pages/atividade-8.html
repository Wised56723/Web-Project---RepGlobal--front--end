<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Atividade 08</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-dark text-light">
    <main class="container my-5">
        <section class="card login-card mx-auto p-4" aria-labelledby="login-title" style="max-width:420px;">
            <h1 id="login-title" class="h4 mb-2">Área de Login</h1>
            <p class="muted mb-3">Login fictício para fins de estrutura. Ao enviar, será redirecionado à página de administração.</p>

            <form action="admin.html" method="get" novalidate>
                <div class="mb-3">
                    <label for="identifier" class="form-label">E‑mail ou Usuário</label>
                    <input id="identifier" name="identifier" type="text" required
                        pattern="(^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$)|(^[A-Za-z0-9._-]{3,}$)"
                        title="Informe um e‑mail válido (ex: nome@exemplo.com) ou um usuário (mín. 3 caracteres)."
                        placeholder="email@exemplo.com ou usuario123"
                        class="form-control bg-black text-light">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input id="password" name="password" type="password" required minlength="4"
                        title="Senha (mínimo 4 caracteres)" placeholder="••••••••"
                        class="form-control bg-black text-light">
                </div>

                <div class="form-actions d-flex gap-2 justify-content-end">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a class="btn btn-secondary" href="index.html">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
